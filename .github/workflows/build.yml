name: GeoIP Updater

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: geoip-updater
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test and build country database
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          go test ./...
          go build -o ipinfo-country-mmdb .
          curl --fail --silent --show-error --location --retry 3 \
            "https://ipinfo.io/data/ipinfo_lite.csv.gz?token=${IPINFO_TOKEN}" \
            | gzip --decompress --stdout \
            | ./ipinfo-country-mmdb - ipinfo_country.mmdb
          test -s ipinfo_country.mmdb
          echo "TAG_NAME=$(date -u '+%Y.%m.%d')" >> "$GITHUB_ENV"

      - name: Check daily release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG_NAME already exists; keeping it unchanged."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body: ${{ env.TAG_NAME }}
          make_latest: true
          fail_on_unmatched_files: true
          files: ipinfo_country.mmdb

      - name: Remove old releases
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName | test("^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}$"))) | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done

      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --workflow build.yml --limit 100 --json databaseId \
            --jq 'map(select(.databaseId != ${{ github.run_id }})) | .[1:] | .[].databaseId' |
            while read -r run_id; do
              gh api "repos/${{ github.repository }}/actions/runs/${run_id}" --method DELETE
            done
