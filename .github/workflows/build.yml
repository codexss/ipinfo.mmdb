name: GeoIP Updater

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: geoip-updater
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone Repository
        run: |
          git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} .

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test and build country database
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          go test ./...
          go build -o ipinfo-country-mmdb .
          curl --fail --silent --show-error --location --retry 3 \
            "https://ipinfo.io/data/ipinfo_lite.csv.gz?token=${IPINFO_TOKEN}" \
            | gzip --decompress --stdout \
            | ./ipinfo-country-mmdb - ipinfo_country.mmdb
          test -s ipinfo_country.mmdb
          echo "TAG_NAME=$(date -u '+%Y.%m.%d')" >> "$GITHUB_ENV"

      - name: Push to "download" branch
        run: |
          git init
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout -b download
          git add ipinfo_country.mmdb
          git commit -m "${{ env.TAG_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin download

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          body: ${{ env.TAG_NAME }}
          files: ipinfo_country.mmdb

      - name: Remove old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName | test("^[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}$"))) | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done

      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --workflow build.yml --limit 100 --json databaseId \
            --jq 'map(select(.databaseId != ${{ github.run_id }})) | .[1:] | .[].databaseId' |
            while read -r run_id; do
              gh api "repos/${{ github.repository }}/actions/runs/${run_id}" --method DELETE
            done
